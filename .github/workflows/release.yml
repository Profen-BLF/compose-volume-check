name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag such as v0.1.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate the release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Build and verify the distributions
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          python -m pip install --no-deps dist/*.whl
          test "$(compose-volume-check --version)" = "compose-volume-check ${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
